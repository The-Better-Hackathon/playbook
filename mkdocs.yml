site_name: The Better Hackathon Playbook
site_description: A playbook for challenge-led hackathons that turn real industry problems into working prototypes, talent, and partnerships.
site_author: Jenna Ritten
site_url: https://the-better-hackathon.github.io/playbook/
repo_name: The Better Hackathon Playbook
repo_url: https://github.com/The-Better-Hackathon/playbook
edit_uri: ""
copyright: Created by Jenna Ritten (@jritten) · Compass Detroit

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: DM Sans
    code: IBM Plex Mono
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tooltips
    - content.tabs.link
    - search.share
    - content.code.copy
  icon:
    logo: material/compass-outline

extra_css:
  - assets/css/playbook.css
extra_javascript:
  - assets/js/tables.js
  - assets/js/playbook-builder.js
  - assets/js/workbook.js
  - assets/js/brief-builder.js
  - assets/js/forms.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.snippets:
      auto_append:
        - includes/glossary.md
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Start here: start.md
  - Organize:
      - Build Your Playbook: organize/build-your-playbook.md
      - Design Your Own:
          - organize/index.md
          - 1. Choose your format: organize/format.md
          - 2. Decide how people take part: organize/participation.md
          - 3. Bring in partners: organize/partners.md
          - 4. Design the experience: organize/experience.md
          - 5. Prepare: organize/prepare.md
          - 6. Host the day: organize/host.md
          - 7. Follow up and celebrate: organize/follow-up.md
      - Models:
