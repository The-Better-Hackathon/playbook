site_name: The Better Hackathon Playbook
site_description: A playbook for challenge-led hackathons that turn real industry problems into working prototypes, talent, and partnerships.
site_author: Jenna Ritten
site_url: https://the-better-hackathon.github.io/playbook/
repo_name: The Better Hackathon Playbook
repo_url: https://github.com/The-Better-Hackathon/playbook
edit_uri: ""
copyright: Created by Jenna Ritten (@jritten) · Compass Detroit

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: DM Sans
    code: IBM Plex Mono
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tooltips
    - content.tabs.link
    - search.share
    - content.code.copy
  icon:
    logo: material/compass-outline

extra_css:
  - assets/css/playbook.css
extra_javascript:
  - assets/js/tables.js
  - assets/js/workbook.js
  - assets/js/brief-builder.js
  - assets/js/forms.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.snippets:
      auto_append:
        - includes/glossary.md
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Start here: start.md
  - Organize:
      - organize/index.md
      - 1. Choose your format: organize/format.md
      - 2. Decide how people take part: organize/participation.md
      - 3. Bring in partners: organize/partners.md
      - 4. Design the experience: organize/experience.md
      - 5. Prepare: organize/prepare.md
      - 6. Host the day: organize/host.md
      - 7. Follow up and celebrate: organize/follow-up.md
  - Partner:
      - partner/index.md
      - 1. Choose how you'll take part: partner/ways-to-partner.md
      - 2. Shape your challenge: partner/shape-your-challenge.md
      - 3. Show up for the teams: partner/event-day.md
      - 4. Follow up: partner/follow-up.md
      - 5. Measure outcomes: partner/outcomes.md
  - Models:
      - models/index.md
      - AfroHacks:
          - afrohacks/index.md
          - 1. Gather your community: afrohacks/community.md
          - 2. Choose your format and place: afrohacks/format.md
          - 3. Set up the two paths: afrohacks/two-paths.md
          - 4. Create a space where people belong: afrohacks/belonging.md
          - 5. Host the day: afrohacks/host.md
          - 6. Celebrate and keep going: afrohacks/keep-going.md
      - Open source hackathon:
          - open-source/index.md
          - 1. Recruit projects and maintainers: open-source/projects.md
          - 2. Write maintainer challenges: open-source/challenges.md
          - 3. Set the open source rules: open-source/rules.md
          - 4. Get contributors ready: open-source/ready.md
          - 5. Host and judge: open-source/host.md
          - 6. Keep contributors coming back: open-source/keep-going.md
      - Track options: run/tracks.md
  - Participate:
      - win/index.md
      - Team workbook: win/workbook.md
      - Submit and demo: win/submit.md
      - Resources: win/resources.md
      - Workshop decks: win/decks.md
  - Library:
      - library/index.md
      - Using and crediting: library/credit.md
      - Challenges:
          - challenges/index.md
          - Brief template: challenges/brief-template.md
          - Brief builder: challenges/brief-builder.md
          - DTE Energy: challenges/examples/dte-energy.md
          - StartMidwest: challenges/examples/startmidwest.md
          - The AI Collective Detroit: challenges/examples/ai-collective.md
          - Michigan Innovation Renaissance: challenges/examples/michigan-renaissance.md
      - Formats:
          - run/formats/index.md
          - Pop-up hack day: run/formats/pop-up.md
          - Hack day (1 day): run/formats/hack-day.md
          - 24 hours (2 days): run/formats/24-hour.md
          - 48 hours (3 days): run/formats/48-hour.md
      - Guides:
          - run/index.md
          - Participant experience: run/experience.md
          - Ways to participate: run/participation.md
          - Planning checklist: run/planning.md
          - Hackathon guide: run/hackathon-guide.md
          - Judging and prizes: run/judging-and-prizes.md
          - Code of Conduct: run/code-of-conduct.md
          - After the event: run/after.md
          - Starter kits: build/index.md
